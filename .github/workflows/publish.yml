name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: galaxy-nebula/galaxy-design
          ref: main
          path: ../galaxy-design
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'

      - name: Use latest npm (trusted publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check version not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@galaxy-stack/nebula-cli@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published — skipping publish"
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "Publishing new version $VERSION"
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish (skip prepublishOnly — verify ran locally)
        if: env.SHOULD_PUBLISH == 'true'
        run: npm publish --access public --provenance --ignore-scripts
